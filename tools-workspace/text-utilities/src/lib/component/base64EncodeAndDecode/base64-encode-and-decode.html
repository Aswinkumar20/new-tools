<div class="main-container" fxLayout="column">
  <div>
    <lib-navigation></lib-navigation>
  </div>

  <div class="container">
    <h2>Base64 Encoder & Decoder</h2>

    <div class="input-section">
      <div class="mode-selector">
        <div class="mode-box" [class.active]="mode === 'encode'" (click)="selectMode('encode')">
          Encode
        </div>
        <div class="mode-box" [class.active]="mode === 'decode'" (click)="selectMode('decode')">
          Decode
        </div>
      </div>

      <label>{{ mode === 'encode' ? 'Text to Encode:' : 'Base64 to Decode:' }}</label>
      <textarea rows="6"
        placeholder="{{ mode === 'encode' ? 'Enter text to encode...' : 'Enter Base64 string to decode...' }}"
        [(ngModel)]="inputText" (input)="onInputChange()"></textarea>
    </div>

    <div class="output-section" *ngIf="outputText">
      <label>Result:</label>
      <textarea rows="6" [value]="outputText" readonly></textarea>
    </div>
  </div>
</div>
