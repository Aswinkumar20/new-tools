<div class="main-container" fxLayout="column">
  <div>
    <lib-navigation></lib-navigation>
  </div>

  <div class="container">
    <h2>Text Reversal & Palindrome Checker</h2>

    <div class="toggle-container">
      <label class="switch">
        <input type="checkbox" [checked]="isPalindromeMode" (change)="toggleMode()" />
        <span class="slider"></span>
      </label>
      <span>{{ isPalindromeMode ? 'Palindrome Check' : 'Text Reversal' }}</span>
    </div>

    <input type="text" placeholder="Enter text here..." [(ngModel)]="inputText" (input)="onInputChange()" />

    <div class="result" *ngIf="inputText">
      <ng-container *ngIf="isPalindromeMode; else reversedBlock">
        <p>
          <strong>Palindrome Check:</strong>
          <span [class.true]="palindromeStatus" [class.false]="palindromeStatus === false">
            {{ palindromeStatus ? 'Yes, it is a palindrome!' : 'No, not a palindrome.' }}
          </span>
        </p>
      </ng-container>

      <ng-template #reversedBlock>
        <p><strong>Reversed Text:</strong> {{ resultText }}</p>
      </ng-template>
    </div>
  </div>



</div>
