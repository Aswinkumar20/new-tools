<div class="main-container" fxLayout="column">
  <div>
    <lib-navigation></lib-navigation>
  </div>

  <div class="container">
    <h2>Code/Text Difference Viewer</h2>

    <div class="input-area">
      <div class="input-panel">
        <label>Original</label>
        <textarea [(ngModel)]="text1" (input)="onTextChange()" placeholder="Paste original text or code..."></textarea>
      </div>

      <div class="input-panel">
        <label>Modified</label>
        <textarea [(ngModel)]="text2" (input)="onTextChange()" placeholder="Paste modified text or code..."></textarea>
      </div>
    </div>

    <div class="diff-viewer" *ngIf="diffLinesA.length || diffLinesB.length"
      [ngClass]="{ 'has-diff': hasAnyDifference }">
      <div class="diff-column">
        <label>Original</label>
        <div class="diff-lines">
          <div *ngFor="let line of diffLinesA" [ngClass]="line.type">
            {{ line.text || ' ' }}
          </div>
        </div>
      </div>

      <div class="diff-column">
        <label>Modified</label>
        <div class="diff-lines">
          <div *ngFor="let line of diffLinesB" [ngClass]="line.type">
            {{ line.text || ' ' }}
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
