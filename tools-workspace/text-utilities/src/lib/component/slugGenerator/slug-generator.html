<div class="main-container" fxLayout="column">
  <div>
    <lib-navigation></lib-navigation>
  </div>

  <div class="container">
    <h2>Slug Generator</h2>

    <p class="info">
      A <strong>slug</strong> is a clean, URL-friendly version of a title or phrase. 
      For example, “My First Blog Post!” becomes <em>my-first-blog-post</em>.
    </p>

    <label for="title">Enter Text:</label>
    <textarea
      id="title"
      [(ngModel)]="inputText"
      (input)="onInputChange()"
      rows="4"
      placeholder="Type your title or phrase here..."
    ></textarea>

    <!-- Options Section -->
    <div class="options">
      <h3>Options</h3>

      <div class="option-item">
        <label for="separator">Separator:</label>
        <select id="separator" [(ngModel)]="separator" (change)="onInputChange()">
          <option value="-">Hyphen (-)</option>
          <option value="_">Underscore (_)</option>
          <option value="+">Plus (+)</option>
        </select>
      </div>

      <div class="option-item checkbox">
        <input
          type="checkbox"
          id="removeNumbers"
          [(ngModel)]="removeNumbers"
          (change)="onInputChange()"
        />
        <label for="removeNumbers">Remove numbers from slug</label>
      </div>
    </div>

    <!-- Result Section -->
    <div class="result" *ngIf="slug">
      <label>Generated Slug:</label>
      <textarea readonly rows="2">{{ slug }}</textarea>

      <div class="actions">
        <button (click)="copySlug()">Copy</button>
      </div>

      <p class="preview">🔗 Preview: https://example.com/{{ slug }}</p>
    </div>

    <!-- History Section -->
    <div class="history" *ngIf="slugHistory.length > 0">
      <h3>Slug History</h3>
      <ul>
        <li *ngFor="let s of slugHistory">{{ s }}</li>
      </ul>
    </div>
  </div>
</div>
