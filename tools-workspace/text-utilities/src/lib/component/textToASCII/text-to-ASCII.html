<div>
  <lib-navigation></lib-navigation>
  <div class="converter-container">
    <h2>Text Converter</h2>

    <p class="how-to">
      How to use: Select the input type on the left and the desired output type on the right. Enter your input and click
      <strong>Convert</strong>. Use <em>Swap</em> to swap types, <em>Clear</em> to reset, and <em>Copy</em> to copy the
      output.
    </p>

    <div class="selector-row">
      <div class="form-group">
        <label for="leftType">Input Type</label>
        <select id="leftType" [(ngModel)]="leftType">
          <option *ngFor="let option of typeOptions" [value]="option.value" [title]="option.description">{{ option.label
            }}</option>
        </select>
        <small class="type-guide">{{ getTypeDescription(leftType) }}</small>
      </div>

      <div class="form-group swap-group">
        <button class="swap-button" (click)="swapTypes()" title="Swap input and output types">⇄</button>
      </div>

      <div class="form-group">
        <label for="rightType">Output Type</label>
        <select id="rightType" [(ngModel)]="rightType">
          <option *ngFor="let option of typeOptions" [value]="option.value" [title]="option.description">{{ option.label
            }}</option>
        </select>
        <small class="type-guide">{{ getTypeDescription(rightType) }}</small>
      </div>
    </div>

    <div class="form-group">
      <label for="inputValue">Input</label>
      <textarea id="inputValue" [(ngModel)]="inputValue" rows="6" placeholder="Enter your input here..."></textarea>
    </div>

    <div class="control-row">
      <button (click)="convert()">Convert</button>
      <button type="button" class="secondary" (click)="clear()">Clear</button>
      <button type="button" class="secondary" (click)="copyOutput()">Copy Output</button>
    </div>

    <div class="form-group">
      <label>Output</label>
      <textarea rows="6" [value]="outputValue" readonly></textarea>
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
  </div>

</div>
