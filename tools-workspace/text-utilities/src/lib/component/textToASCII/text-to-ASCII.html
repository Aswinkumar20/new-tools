<div class="main-container" fxLayout="column">
  <div>
    <lib-navigation></lib-navigation>
  </div>

  <div class="ascii-container">
    <h2>{{ mode === 'text-to-ascii' ? 'Text to ASCII' : 'ASCII to Text' }}</h2>

    <button class="mode-toggle" (click)="toggleMode()">
      Switch to {{ mode === 'text-to-ascii' ? 'ASCII to Text' : 'Text to ASCII' }}
    </button>

    <textarea [(ngModel)]="input" (input)="updateConversion()"
      [placeholder]="mode === 'text-to-ascii' ? 'Enter text...' : 'Enter ASCII codes (e.g. 72 101 108 108 111)'"
      rows="4"></textarea>

    <div class="ascii-output" *ngIf="output">
      <h3>Output:</h3>
      <p class="ascii-values">{{ output }}</p>

      <button (click)="copyToClipboard()">Copy Output</button>
    </div>
  </div>

</div>
