<div class="main-container" fxLayout="column">
  <div>
    <lib-navigation></lib-navigation>
  </div>

  <div class="container">
    <h2>Remove Duplicate Words</h2>

    <label for="inputText">Input Text:</label>
    <textarea id="inputText" [(ngModel)]="inputText" placeholder="Paste your text here..." rows="10"></textarea>

    <button (click)="removeDuplicates()" [disabled]="!inputText.trim()">Remove Duplicates</button>
    <button (click)="clear()" class="clear-btn">Clear</button>

    <label>Input Text with Duplicates Highlighted:</label>
    <div class="highlighted-output" [innerHTML]="highlightedInput"></div>

    <label for="outputText">Output Text (Duplicates Removed):</label>
    <textarea id="outputText" [value]="outputText" readonly rows="10"></textarea>
  </div>

</div>
