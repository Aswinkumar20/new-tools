<div class="main-container" fxLayout="column">
  <lib-navigation></lib-navigation>

  <div class="tool-card" style="padding: 2rem; max-width: 600px; margin: 2rem auto;">
    <h2 style="margin-bottom: 0.5rem;">🧹 Remove Duplicate Words</h2>
    <p class="subtitle" style="margin-bottom: 1.5rem;">Clean up your text instantly — highlight and remove repeated words easily.</p>

    <div class="input-section" style="margin-bottom: 2rem;">
      <label for="inputText" style="display: block; margin-bottom: 0.5rem;">Input Text:</label>
      <textarea
        id="inputText"
        [(ngModel)]="inputText"
        (ngModelChange)="onInputChange($event)"
        placeholder="Paste or type your text here..."
        rows="10"
        aria-label="Input text area"
        style="width: 100%; margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box;"
      ></textarea>

      <div class="button-group" style="display: flex; gap: 1rem; margin-bottom: 1rem;">
        <button (click)="clear()" class="clear-btn" style="flex: 1; padding: 0.5rem 0;">Clear</button>
      </div>

      <div class="info-bar" *ngIf="inputText" style="display: flex; gap: 2rem; font-size: 0.95rem; color: #666;">
        <span>Words: {{ wordCount }}</span>
        <span *ngIf="duplicateCount">Duplicates: {{ duplicateCount }}</span>
      </div>
    </div>

    <div class="highlight-section" *ngIf="highlightedInput" style="margin-bottom: 2rem;">
      <label style="display: block; margin-bottom: 0.5rem;">Highlighted Duplicates:</label>
  <div class="highlighted-output" [innerHTML]="highlightedInput" style="background: #f9f9f9; border: 1px solid #eee; border-radius: 6px; padding: 1rem; min-height: 60px; box-sizing: border-box; padding-right: 1rem;"></div>
    </div>

    <div class="output-section" *ngIf="outputText" style="margin-bottom: 1rem;">
      <label for="outputText" style="display: block; margin-bottom: 0.5rem;">Output Text (Duplicates Removed):</label>
  <textarea id="outputText" [value]="outputText" readonly rows="10" style="width: 100%; margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box;"></textarea>

      <button (click)="copyOutput()" class="copy-btn" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 5px; border: none; background: #007bff; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle;"><rect x="5" y="7" width="9" height="11" rx="2" fill="#888"/><rect x="7" y="2" width="9" height="11" rx="2" fill="#bbb"/></svg>
        <span >Copy Output</span>
      </button>
      <span *ngIf="copied" class="copy-notice" style="margin-left: 1rem; color: #4caf50; font-weight: 500;">Copied!</span>
    </div>
  </div>
</div>
