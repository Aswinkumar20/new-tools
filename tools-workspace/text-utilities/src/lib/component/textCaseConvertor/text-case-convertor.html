<div class="main-container" fxLayout="column">
  <div>
    <lib-navigation></lib-navigation>
  </div>

  <div class="container">
    <h2>Text Case Converter</h2>

    <!-- Input Text Area -->
    <div class="input-section" [class.has-content]="inputText">
      <div class="editor-container">
         <textarea class="text-area" [(ngModel)]="inputText" (input)="onInputChange(inputText)" rows="6"
        placeholder="Type or paste your text here..."></textarea>

            <!-- Converted Output -->
        <div *ngIf="convertedText" class="output-section">
          <label for="convertedTextArea">Converted Text</label>
          <textarea id="convertedTextArea" readonly rows="6" [value]="convertedText"></textarea>

          <!-- Icon Actions -->
          <div class="icon-actions" role="group" aria-label="Text actions">
            <button class="icon-btn" (click)="copyToClipboard()" aria-label="Copy to clipboard">
              <img src="assets/icons/copy.svg" alt="Copy" class="icon-svg">
              <span class="tooltip">Copy to clipboard</span>
            </button>

            <button class="icon-btn" (click)="downloadText()" aria-label="Download text file">
              <img src="assets/icons/txt.svg" alt="Download" class="icon-svg">
              <span class="tooltip">Download text file</span>
            </button>

            <button class="icon-btn" (click)="undo()" [disabled]="undoStack.length <= 1" aria-label="Undo">
              <img src="assets/icons/undo.svg" alt="Undo" class="icon-svg">
              <span class="tooltip">Undo</span>
            </button>

            <button class="icon-btn" (click)="redo()" [disabled]="redoStack.length === 0" aria-label="Redo">
              <img src="assets/icons/redo.svg" alt="Redo" class="icon-svg">
              <span class="tooltip">Redo</span>
            </button>

            <button class="icon-btn" (click)="reset()" aria-label="Reset">
              <img src="assets/icons/clear.svg" alt="Reset" class="icon-svg">
              <span class="tooltip">Reset</span>
            </button>
          </div>

        </div>
      </div>
     

      <!-- Character and Word Counts -->
      <div class="counts">
        <span>Characters: {{ charCount }}</span>
        <span>Words: {{ wordCount }}</span>
      </div>
    </div>

    <!-- Case Conversion Categories -->
    <div class="categories-container">
      <!-- Standard Cases -->
      <div class="category">
        <h3>Standard Cases</h3>
        <div class="button-group">
          <button [class.active]="selectedCase === 'lower'" (click)="onCaseChange('lower')">lowercase</button>
          <button [class.active]="selectedCase === 'upper'" (click)="onCaseChange('upper')">UPPERCASE</button>
          <button [class.active]="selectedCase === 'sentence'" (click)="onCaseChange('sentence')">Sentence case</button>
          <button [class.active]="selectedCase === 'title'" (click)="onCaseChange('title')">Title Case</button>
          <button [class.active]="selectedCase === 'toggle'" (click)="onCaseChange('toggle')">Toggle Case</button>
        </div>
      </div>

      <!-- Programming Cases -->
      <div class="category">
        <h3>Programming Cases</h3>
        <div class="button-group">
          <button [class.active]="selectedCase === 'camel'" (click)="onCaseChange('camel')">camelCase</button>
          <button [class.active]="selectedCase === 'pascal'" (click)="onCaseChange('pascal')">PascalCase</button>
          <button [class.active]="selectedCase === 'snake'" (click)="onCaseChange('snake')">snake_case</button>
          <button [class.active]="selectedCase === 'upperSnake'" (click)="onCaseChange('upperSnake')">UPPER_SNAKE_CASE</button>
          <button [class.active]="selectedCase === 'kebab'" (click)="onCaseChange('kebab')">kebab-case</button>
          <button [class.active]="selectedCase === 'train'" (click)="onCaseChange('train')">Train-Case</button>
          <button [class.active]="selectedCase === 'dot'" (click)="onCaseChange('dot')">dot.case</button>
          <button [class.active]="selectedCase === 'path'" (click)="onCaseChange('path')">path/case</button>
          <button [class.active]="selectedCase === 'constant'" (click)="onCaseChange('constant')">CONSTANT_CASE</button>
          <button [class.active]="selectedCase === 'macro'" (click)="onCaseChange('macro')">MACRO_CASE</button>
          <button [class.active]="selectedCase === 'camelSnake'" (click)="onCaseChange('camelSnake')">camel_Snake_Case</button>
          <button [class.active]="selectedCase === 'pascalSnake'" (click)="onCaseChange('pascalSnake')">Pascal_Snake_Case</button>
          <button [class.active]="selectedCase === 'dotPascal'" (click)="onCaseChange('dotPascal')">Dot.Pascal.Case</button>
        </div>
      </div>

      <!-- Stylistic Cases -->
      <div class="category">
        <h3>Fun & Stylistic Cases</h3>
        <div class="button-group">
          <button [class.active]="selectedCase === 'alternating'" (click)="onCaseChange('alternating')">aLtErNaTiNg</button>
          <button [class.active]="selectedCase === 'studly'" (click)="onCaseChange('studly')">StUdLy CaPs</button>
          <button [class.active]="selectedCase === 'reversed'" (click)="onCaseChange('reversed')">Reversed Case</button>
          <button [class.active]="selectedCase === 'vowelUpper'" (click)="onCaseChange('vowelUpper')">vOwEl UppEr</button>
          <button [class.active]="selectedCase === 'consonantUpper'" (click)="onCaseChange('consonantUpper')">CoNSoNaNT</button>
          <button [class.active]="selectedCase === 'leet'" (click)="onCaseChange('leet')">1337 5P34K</button>
          <button [class.active]="selectedCase === 'fullwidth'" (click)="onCaseChange('fullwidth')">Ｆｕｌｌｗｉｄｔｈ</button>
          <button [class.active]="selectedCase === 'smallCaps'" (click)="onCaseChange('smallCaps')">sᴍᴀʟʟ ᴄᴀᴘs</button>
          <button [class.active]="selectedCase === 'upsideDown'" (click)="onCaseChange('upsideDown')">uʍop ǝpᴉsd∩</button>
          <button [class.active]="selectedCase === 'mixed'" (click)="onCaseChange('mixed')">MiXeD cAsE</button>
          <button [class.active]="selectedCase === 'bracketed'" (click)="onCaseChange('bracketed')">[bracketed]</button>
        </div>
      </div>
    </div>

  </div>
</div>
