<div class="main-container" fxLayout="column">
  <div>
    <lib-navigation></lib-navigation>
  </div>

  <div class="container">
    <h2>Text Case Converter</h2>

    <!-- Input Text Area -->
    <textarea [(ngModel)]="inputText" (input)="onInputChange(inputText)" rows="6"
      placeholder="Type or paste your text here..."></textarea>

    <!-- Character and Word Counts -->
    <div class="counts">
      <span>Characters: {{ charCount }}</span>
      <span>Words: {{ wordCount }}</span>
    </div>

    <!-- Case Conversion Options -->
    <div class="button-group">
      <button [class.active]="selectedCase === 'upper'" (click)="onCaseChange('upper')">UPPERCASE</button>
      <button [class.active]="selectedCase === 'lower'" (click)="onCaseChange('lower')">lowercase</button>
      <button [class.active]="selectedCase === 'title'" (click)="onCaseChange('title')">Title Case</button>
      <button [class.active]="selectedCase === 'sentence'" (click)="onCaseChange('sentence')">Sentence case</button>
      <button [class.active]="selectedCase === 'toggle'" (click)="onCaseChange('toggle')">Toggle Case</button>
      <button [class.active]="selectedCase === 'camel'" (click)="onCaseChange('camel')">camelCase</button>
      <button [class.active]="selectedCase === 'pascal'" (click)="onCaseChange('pascal')">PascalCase</button>
      <button [class.active]="selectedCase === 'snake'" (click)="onCaseChange('snake')">snake_case</button>
      <button [class.active]="selectedCase === 'kebab'" (click)="onCaseChange('kebab')">kebab-case</button>
    </div>

    <!-- Converted Output -->
    <div *ngIf="convertedText" class="output-section">
      <label for="convertedTextArea">Converted Text</label>
      <textarea id="convertedTextArea" readonly rows="6" [value]="convertedText"></textarea>

      <!-- Icon Actions -->
      <div class="icon-actions" role="group" aria-label="Text actions">
        <button class="icon-btn" (click)="copyToClipboard()" aria-label="Copy to clipboard" title="Copy">
          📋
        </button>
        <button class="icon-btn" (click)="downloadText()" aria-label="Download text file" title="Download">
          ⬇️
        </button>
        <button class="icon-btn" (click)="undo()" [disabled]="undoStack.length <= 1" aria-label="Undo" title="Undo">
          ↩️
        </button>
        <button class="icon-btn" (click)="redo()" [disabled]="redoStack.length === 0" aria-label="Redo" title="Redo">
          ↪️
        </button>
        <button class="icon-btn" (click)="reset()" aria-label="Reset" title="Reset">
          🗑️
        </button>
      </div>
    </div>
  </div>

</div>
