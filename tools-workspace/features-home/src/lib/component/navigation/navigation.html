<div class="main-header-container flex-row space-between-center gap-1em">
  <div class="left-container flex-row start-center gap-1em">
    <div class="logo">
      <img [src]="logoUrl" alt="Logo" />
    </div>

    <span
      class="header-link"
      [class.active]="activeLink === 'home'"
      (click)="navigateTo('home')"
    >
      Home
    </span>

    <div class="header-links flex-row end-center gap-1em">
      <div
        class="dropdown"
        (mouseenter)="onDropdownEnter()"
        (mouseleave)="isDropdownOpen = false"
      >
        <span
          class="header-link dropdown-toggle"
          [class.active]="activeLink === 'categories'"
        >
          Categories
        </span>

        <div class="dropdown-content" *ngIf="isDropdownOpen">
          <div class="dropdown-title">Below are the categories</div>

          <div class="dropdown-body flex-row gap-1em">
            <!-- LEFT: Main Categories -->
            <div class="main-categories">
              <div
                class="category-item"
                *ngFor="let category of categoriesList"
                (mouseenter)="hoveredCategory = category"
              >
                <div class="category-name">{{ category.name }}</div>
                <div class="category-description">{{ category.description }}</div>
              </div>
            </div>

            <!-- RIGHT: Subcategories or Placeholder -->
            <div class="sub-categories">
              <ng-container *ngIf="hoveredCategory; else emptyPlaceholder">
                <div
                  class="category-link"
                  *ngFor="let sub of hoveredCategory.subCategories"
                  (click)="navigateTo(sub.path)"
                >
                  {{ sub?.name }}
                </div>
              </ng-container>

              <ng-template #emptyPlaceholder>
                <div class="empty-placeholder">
                  Hover a category to see tools
                </div>
              </ng-template>
            </div>
          </div>
        </div>
      </div>
    </div>

    <span
      class="header-link"
      [class.active]="activeLink === 'about'"
      (click)="navigateTo('about')"
    >
      About
    </span>
    <span
      class="header-link"
      [class.active]="activeLink === 'contact'"
      (click)="navigateTo('contact')"
    >
      Contact
    </span>
  </div>

  <div class="right-container flex-row end-center gap-1em">
    <span
      class="header-link"
      [class.active]="activeLink === 'login'"
      (click)="navigateTo('login')"
    >
      Login
    </span>
    <span
      class="header-link"
      [class.active]="activeLink === 'signup'"
      (click)="navigateTo('signup')"
    >
      Sign Up
    </span>
  </div>
</div>
