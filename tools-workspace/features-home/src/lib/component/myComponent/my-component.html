<div class="main-container column">
  <!-- Header -->
  <div class="header-content row space-between center">
    <lib-navigation class="full-width"></lib-navigation>
  </div>

  <!-- Hero Section -->
  <div class="hero-section column center center gap-05">
    <h1 class="hero-title">Your All-in-One Digital Toolkit</h1>
    <p class="hero-subtitle">
      Streamline your daily tasks with powerful, easy-to-use tools for text, files, development, and more.
      Efficiency at your fingertips, designed for speed and simplicity.
    </p>

    <div class="search-bar row center center">
      <input
        type="text"
        placeholder="Search for a specific tool..."
        [(ngModel)]="searchQuery"
        (input)="filterCategories()" />
      <button (click)="filterCategories()">Find</button>
    </div>
  </div>

  <!-- Categories -->
  <div class="body-content column start center gap-1">
    <div class="body-content-details row wrap start center">
      <div
        class="category-card column start start"
        *ngFor="let category of filteredCategories">
        
        <div class="category-title row gap-05">
          <span>{{ category.name }}</span>
        </div>

        <div class="category-description">{{ category.description }}</div>

        <div class="tools-list-child-container">
          <div
            class="tool-item"
            *ngFor="let tool of category.subCategories"
            (click)="navigateTo(tool.path)">
            {{ tool.name }}
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
</div>
