<footer class="site-footer" aria-label="Site footer">
  <div class="site-footer__inner">
    <section class="site-footer__branding">
      <a routerLink="/tools/home" class="site-footer__logo">
        Tools Workspace
      </a>
      <p class="site-footer__tagline">
        A unified suite of dependable tools for designers, developers, analysts, and makers.
        Everything runs securely inside your browser.
      </p>
    </section>

    <section class="site-footer__links" *ngIf="sections$ | async as sections">
      <article class="site-footer__column" *ngFor="let section of sections; trackBy: trackByTitle">
        <h3>{{ section.title }}</h3>
        <ul>
          <li *ngFor="let link of section.links; trackBy: trackByLink">
            <a [routerLink]="link.path" class="site-footer__link">
              {{ link.label }}
            </a>
            <p *ngIf="link.description" class="site-footer__description">
              {{ link.description }}
            </p>
          </li>
        </ul>
      </article>
    </section>
  </div>

  <div class="site-footer__meta">
    <span>© {{ year }} Tools Workspace. All rights reserved.</span>
    <nav aria-label="Foundation links">
      <a *ngFor="let item of metaLinks" [routerLink]="item.path">
        {{ item.label }}
      </a>
    </nav>
  </div>
</footer>
