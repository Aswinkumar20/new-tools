<div
  class="toast"
  [ngStyle]="styles"
  role="status"
  aria-live="polite"
  aria-atomic="true"
  [attr.aria-hidden]="show ? null : 'true'"
>
  <span class="toast__message">{{ message }}</span>
  <button
    type="button"
    class="toast__close"
    aria-label="Dismiss notification"
    (click)="dismiss()"
  >
    <span aria-hidden="true">&times;</span>
  </button>
</div>
