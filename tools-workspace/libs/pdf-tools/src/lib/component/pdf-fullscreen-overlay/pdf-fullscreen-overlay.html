@if (open) {
  <div class="ctl-pdf__fs" #fsContainer role="dialog" aria-modal="true" [attr.aria-label]="title">
    <header class="ctl-pdf__fs-bar">
      <span class="ctl-pdf__fs-title">{{ title }}</span>
      <div class="ctl-pdf__fs-actions">
        <ng-content select="[pdfFsToolbar]" />
        <button type="button" class="ctl-pdf__fs-close" (click)="close()" aria-label="Exit fullscreen" appTooltip="Exit fullscreen" tooltipPosition="bottom">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
    </header>
    <div class="ctl-pdf__fs-body">
      <canvas #fsCanvas class="ctl-pdf__fs-canvas"></canvas>
    </div>
  </div>
}
