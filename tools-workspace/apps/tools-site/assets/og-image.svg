<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative background shapes -->
  <circle cx="100" cy="100" r="150" fill="white" opacity="0.08"/>
  <circle cx="1100" cy="530" r="180" fill="white" opacity="0.08"/>
  <circle cx="1050" cy="80" r="100" fill="white" opacity="0.1"/>
  <circle cx="200" cy="550" r="120" fill="white" opacity="0.08"/>
  
  <!-- Tool icons grid (representing various tools) -->
  <g opacity="0.15">
    <!-- Wrench icon -->
    <g transform="translate(100, 150)">
      <rect x="0" y="0" width="40" height="40" rx="8" fill="white"/>
      <path d="M 20 10 L 30 20 L 20 30 L 10 20 Z" fill="#6366f1"/>
    </g>
    
    <!-- File icon -->
    <g transform="translate(200, 150)">
      <rect x="0" y="0" width="40" height="40" rx="8" fill="white"/>
      <rect x="10" y="10" width="20" height="20" fill="#6366f1"/>
    </g>
    
    <!-- Code icon -->
    <g transform="translate(300, 150)">
      <rect x="0" y="0" width="40" height="40" rx="8" fill="white"/>
      <path d="M 10 20 L 15 15 L 20 20 L 15 25 Z M 20 20 L 25 15 L 30 20 L 25 25 Z" fill="#6366f1"/>
    </g>
    
    <!-- Image icon -->
    <g transform="translate(100, 250)">
      <rect x="0" y="0" width="40" height="40" rx="8" fill="white"/>
      <rect x="10" y="10" width="20" height="15" rx="2" fill="#6366f1"/>
      <circle cx="25" cy="30" r="3" fill="#6366f1"/>
    </g>
    
    <!-- Chart icon -->
    <g transform="translate(200, 250)">
      <rect x="0" y="0" width="40" height="40" rx="8" fill="white"/>
      <path d="M 10 30 L 15 20 L 20 25 L 25 15 L 30 20 L 30 30 Z" fill="#6366f1"/>
    </g>
  </g>
  
  <!-- Main logo/tool icon -->
  <g transform="translate(150, 200)">
    <!-- Large tool icon -->
    <circle cx="200" cy="100" r="80" fill="white" opacity="0.2" stroke="white" stroke-width="4"/>
    <circle cx="200" cy="100" r="60" fill="white" opacity="0.3"/>
    
    <!-- Tool symbol -->
    <g transform="translate(150, 60)">
      <path d="M 50 40 L 80 10 L 110 40 L 140 10 L 110 -20 L 80 10 L 50 -20 Z" 
            fill="white" opacity="0.9" stroke="white" stroke-width="2"/>
      <rect x="50" y="40" width="60" height="15" rx="7" fill="white" opacity="0.9"/>
      <circle cx="80" cy="10" r="25" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
      <circle cx="80" cy="10" r="15" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
      <line x1="80" y2="10" x2="80" y2="-15" stroke="white" stroke-width="3" opacity="0.9"/>
      <line x1="80" y2="10" x2="80" y2="35" stroke="white" stroke-width="3" opacity="0.9"/>
      <line x1="55" y1="10" x2="105" y2="10" stroke="white" stroke-width="3" opacity="0.9"/>
    </g>
  </g>
  
  <!-- Website name - Large and prominent -->
  <text x="600" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="84" font-weight="bold" fill="url(#textGradient)" letter-spacing="-2">
    EasyToolHub
  </text>
  
  <!-- Tagline -->
  <text x="600" y="360" font-family="'Segoe UI', Arial, sans-serif" font-size="32" fill="white" opacity="0.95" letter-spacing="0.5">
    Your All-in-One Digital Toolkit
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="410" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="white" opacity="0.85">
    Streamline your daily tasks with powerful, easy-to-use tools
  </text>
  
  <!-- Feature highlights -->
  <g opacity="0.9">
    <text x="600" y="480" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="white">
      Text Tools • File Converters • PDF Tools • Image Tools • Dev Tools
    </text>
  </g>
  
  <!-- Decorative line -->
  <line x1="600" y1="500" x2="1000" y2="500" stroke="white" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
</svg>
