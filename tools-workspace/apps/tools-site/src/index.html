    <meta name="revisit-after" content="7 days" />

    <link rel="canonical" href="https://easytoolhub.com/tools/home" />
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "EasyToolHub",
      "url": "https://easytoolhub.com",
      "description": "Streamline your daily tasks with powerful, easy-to-use tools for text, files, development, and more. Free online tools for everyone.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://easytoolhub.com/tools?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "EasyToolHub",
      "url": "https://easytoolhub.com",
      "logo": "https://easytoolhub.com/assets/og-image.svg"
    }
    </script>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C7L2T1RHVW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-C7L2T1RHVW', { send_page_view: false }); // Disable auto pageview for SPA
    </script>

    <script>
      // Apply theme immediately to prevent flash of unstyled content
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const root = document.documentElement;
        
        if (savedTheme) {
          root.setAttribute('data-theme', savedTheme);
        } else {
          // Check system preference
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        }
      })();
    </script>
