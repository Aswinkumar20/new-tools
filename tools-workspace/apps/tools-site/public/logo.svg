<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#6366f1"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#grad2)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="white" opacity="0.1"/>
  <circle cx="1100" cy="530" r="120" fill="white" opacity="0.1"/>
  <circle cx="1050" cy="100" r="60" fill="white" opacity="0.15"/>
  
  <!-- Tool icon - Wrench/Tool symbol -->
  <g transform="translate(150, 200)">
    <!-- Main tool body -->
    <path d="M 200 150 L 250 100 L 300 150 L 350 100 L 300 50 L 250 100 L 200 50 Z" 
          fill="white" opacity="0.9" stroke="white" stroke-width="3"/>
    <!-- Tool handle -->
    <rect x="200" y="150" width="100" height="20" rx="10" fill="white" opacity="0.9"/>
    <!-- Gear icon -->
    <circle cx="250" cy="100" r="30" fill="none" stroke="white" stroke-width="4" opacity="0.9"/>
    <circle cx="250" cy="100" r="20" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
    <line x1="250" y1="70" x2="250" y2="130" stroke="white" stroke-width="3" opacity="0.9"/>
    <line x1="220" y1="100" x2="280" y2="100" stroke="white" stroke-width="3" opacity="0.9"/>
  </g>
  
  <!-- Website name -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">
    EasyToolHub
  </text>
  
  <!-- Tagline -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="28" fill="white" opacity="0.95">
    Your All-in-One Digital Toolkit
  </text>
  
  <!-- Decorative elements -->
  <g opacity="0.3">
    <rect x="500" y="420" width="200" height="4" rx="2" fill="white"/>
    <rect x="500" y="440" width="150" height="4" rx="2" fill="white"/>
  </g>
</svg>
