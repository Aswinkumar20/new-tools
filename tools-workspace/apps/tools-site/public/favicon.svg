<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Simplified icon for favicon -->
  <g transform="translate(32, 32)">
    <!-- Central hub -->
    <circle cx="0" cy="0" r="18" fill="url(#faviconGrad)"/>
    <circle cx="0" cy="0" r="7" fill="white"/>
    
    <!-- Three connected nodes -->
    <circle cx="0" cy="-24" r="8" fill="url(#faviconGrad)"/>
    <circle cx="21" cy="12" r="8" fill="url(#faviconGrad)"/>
    <circle cx="-21" cy="12" r="8" fill="url(#faviconGrad)"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="-18" x2="0" y2="-16" stroke="url(#faviconGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="7" x2="13" y2="10" stroke="url(#faviconGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-12" y1="7" x2="-13" y2="10" stroke="url(#faviconGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Simple icons in nodes -->
    <circle cx="0" cy="-24" r="3" fill="white"/>
    <rect x="-2" y="-1" width="4" height="6" rx="1" fill="white" transform="translate(21, 12)"/>
    <rect x="-3" y="-2" width="6" height="4" rx="1" fill="white" transform="translate(-21, 12)"/>
  </g>
</svg>

